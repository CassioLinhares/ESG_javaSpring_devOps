name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e empacotar
        run: ./mvnw -B package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/spring_backend_esg-0.0.1-SNAPSHOT.jar
          retention-days: 7

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: build
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: esg
          APP_USER_PASSWORD: esg123
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    env:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//localhost:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: esg
      SPRING_DATASOURCE_PASSWORD: esg123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes
        run: ./mvnw -B test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Definir nome da imagem
        run: |
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'
    environment:
      name: staging
    env:
      APP_IMAGE: ${{ needs.docker.outputs.image }}
      APP_PORT: 8081
      ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD || 'oracle' }}
      DB_USER: ${{ vars.DB_USER || 'esg' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'esg123' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'staging-secret' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir ambiente
        run: docker compose -p esg-staging up -d --no-build --wait --wait-timeout 600

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:${APP_PORT}/auth/register" \
              -H 'Content-Type: application/json' \
              -d '{"nome":"Smoke","email":"smoke@example.com","senha":"123456","role":"ADMIN"}' || true)
            [ "$STATUS" = "201" ] && break
            sleep 5
          done
          [ "$STATUS" = "201" ]
          curl -sf -X POST "http://localhost:${APP_PORT}/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","senha":"123456"}' | grep -q token

      - name: Logs
        if: always()
        run: docker compose -p esg-staging logs app

  deploy-production:
    name: Deploy Produção
    runs-on: ubuntu-latest
    needs: [docker, deploy-staging]
    if: github.event_name != 'pull_request'
    environment:
      name: production
    env:
      APP_IMAGE: ${{ needs.docker.outputs.image }}
      APP_PORT: 8080
      ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD || 'oracle' }}
      DB_USER: ${{ vars.DB_USER || 'esg' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'esg123' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'production-secret' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir ambiente
        run: docker compose -p esg-production up -d --no-build --wait --wait-timeout 600

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:${APP_PORT}/auth/register" \
              -H 'Content-Type: application/json' \
              -d '{"nome":"Smoke","email":"smoke@example.com","senha":"123456","role":"ADMIN"}' || true)
            [ "$STATUS" = "201" ] && break
            sleep 5
          done
          [ "$STATUS" = "201" ]
          curl -sf -X POST "http://localhost:${APP_PORT}/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","senha":"123456"}' | grep -q token

      - name: Logs
        if: always()
        run: docker compose -p esg-production logs app
